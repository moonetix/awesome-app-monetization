name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Format, order and duplicates
        run: node scripts/lint-list.mjs
      - name: Tests for the link check and issue scripts
        run: node --test 'scripts/*.test.mjs'
