name: Link check

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check every link, one request per second
        run: node scripts/check-links.mjs README.md --delay=1000
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
